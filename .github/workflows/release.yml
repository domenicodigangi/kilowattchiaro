name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no tokens stored anywhere.
# One-time setup on pypi.org: add a trusted publisher for project
# kilowattchiaro-engine -> repo domenicodigangi/kilowattchiaro, workflow
# release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
