<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28.0 -28.0 1168.0 624.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Runtime architecture &#8212; one VPS, one agent, one wall">
<rect x="-28.0" y="-28.0" width="1168.0" height="624.0" fill="#FAF7F2"/>

    <defs>
      <marker id="arrapx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A5C4F"/>
      </marker>
      <marker id="arrapxg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#967430"/>
      </marker>
      <marker id="arrapxe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5B32"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="280" height="70" rx="14" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
    <text x="24" y="30" font-size="25" font-weight="700" fill="#2C2319">Browser</text>
    <text x="24" y="58" font-size="22" fill="#6A5C4F">kilowattchiaro.it</text>

    <text x="300" y="26" font-size="22" font-weight="700" fill="#755A25">direct PDF upload</text>
    <line x1="280" y1="44" x2="552" y2="44" stroke="#967430" stroke-width="2.5" marker-end="url(#arrapxg)"/>
    <text x="300" y="70" font-size="22" fill="#6A5C4F">5-min HMAC grant</text>

    <line x1="140" y1="70" x2="140" y2="108" stroke="#6A5C4F" stroke-width="2.5" marker-end="url(#arrapx)"/>
    <text x="160" y="98" font-size="22" font-weight="700" fill="#755A25">Cloudflare &#183; Traefik</text>

    <rect x="0" y="112" width="430" height="378" rx="14" fill="#FBF6E9" stroke="#E8E2D8" stroke-width="2"/>
    <text x="16" y="140" font-size="22" font-weight="700" letter-spacing="1" fill="#755A25">HETZNER VPS &#183; TRAEFIK</text>

    <rect x="16" y="156" width="398" height="92" rx="12" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
    <text x="36" y="190" font-size="25" font-weight="700" fill="#2C2319">Next.js 14 &#8212; :3000</text>
    <text x="36" y="222" font-size="22" fill="#6A5C4F">serves both products</text>

    <rect x="16" y="262" width="398" height="122" rx="12" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
    <text x="36" y="296" font-size="25" font-weight="700" fill="#2C2319">Solar API &#8212; FastAPI :8000</text>
    <text x="36" y="328" font-size="22" font-weight="700" fill="#3D5B32">deterministic engine inside</text>
    <text x="36" y="358" font-size="22" fill="#6A5C4F">MCP server at /api/mcp</text>

    <rect x="16" y="398" width="398" height="92" rx="12" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
    <text x="36" y="432" font-size="25" font-weight="700" fill="#2C2319">Booking &#8212; FastAPI :8010</text>
    <text x="36" y="464" font-size="22" fill="#6A5C4F">no LLM &#183; own CRM (SQLite)</text>

    <rect x="560" y="0" width="552" height="282" rx="14" fill="#FBF6E9" stroke="#E8E2D8" stroke-width="2"/>
    <text x="576" y="28" font-size="22" font-weight="700" letter-spacing="1" fill="#755A25">FLY.IO FRANKFURT &#183; THE ONLY MODEL</text>
    <rect x="576" y="44" width="520" height="222" rx="12" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
    <text x="600" y="78" font-size="25" font-weight="700" fill="#2C2319">Quote agent &#8212; FastAPI :7860</text>
    <text x="600" y="110" font-size="22" fill="#6A5C4F">OCR &#8594; strict structured extraction</text>
    <text x="600" y="140" font-size="22" fill="#6A5C4F">catalogue: 1,885 SKUs, datasheet-pinned</text>
    <text x="600" y="170" font-size="22" fill="#6A5C4F">Qdrant: 4,936 chunks &#183; web-hunt fallback</text>
    <text x="600" y="200" font-size="22" fill="#6A5C4F">Redis: daily quotas &#183; 3-hour doc cache</text>
    <text x="600" y="232" font-size="22" font-weight="700" fill="#3D5B32">every number from the engine &#8212; MCP</text>

    <path d="M 560 160 L 488 160 L 488 320 L 422 320" fill="none" stroke="#3D5B32" stroke-width="2.5" marker-end="url(#arrapxe)"/>
    <text x="496" y="250" font-size="22" font-weight="700" fill="#3D5B32">MCP</text>

    <rect x="560" y="310" width="552" height="124" rx="14" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
    <text x="584" y="346" font-size="25" font-weight="700" fill="#2C2319">Supabase &#8212; Postgres + Auth</text>
    <text x="584" y="378" font-size="22" fill="#6A5C4F">EU Frankfurt &#183; profiles &amp; evaluations</text>
    <text x="584" y="408" font-size="22" fill="#6A5C4F">booking verifies JWTs &#8212; read-only</text>

    <line x1="430" y1="372" x2="556" y2="372" stroke="#6A5C4F" stroke-width="2.5" marker-end="url(#arrapx)"/>
    <text x="444" y="362" font-size="22" fill="#755A25">evaluations</text>
  
<rect x="-20.0" y="510.0" width="6" height="40" fill="#967430"/>
<text x="2.0" y="538.0" font-size="25" font-weight="700" fill="#2C2319">The model runs in exactly one box — it can reach the engine and the web, never the installers.</text>
</svg>
